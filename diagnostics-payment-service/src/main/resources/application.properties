spring.application.name=diagnostics-payment-service
server.port=8095

# Existing old database
spring.datasource.url=jdbc:mysql://localhost:3306/plasmit_auth?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=Aman@12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JDBC only - No Hibernate / No JPA
# Do not add spring.jpa.* properties

# JWT secret same as existing auth/hospital services
jwt.secret=PlasmitSaasJwtSecretKeyForAuthenticationServiceMinimumLength256Bits

# Error visibility for local development
server.error.include-message=always
server.error.include-binding-errors=always

# Logging
logging.level.root=INFO
logging.level.com.plasmit.diagnostics.payment=DEBUG
logging.level.org.springframework.security=INFO

# Console logging with MDC
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} requestId=%X{requestId} tenantId=%X{tenantId} hospitalId=%X{hospitalId} branchId=%X{branchId} userId=%X{userId} - %msg%n

# Separate log file
logging.file.name=logs/diagnostics-payment-service.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} requestId=%X{requestId} tenantId=%X{tenantId} hospitalId=%X{hospitalId} branchId=%X{branchId} userId=%X{userId} - %msg%n