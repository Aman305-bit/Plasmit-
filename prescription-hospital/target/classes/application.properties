spring.application.name=prescription-hospital

server.port=8092
server.address=0.0.0.0

# ===============================
# Database Configuration
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/plasmit_auth?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=Aman@12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# No Hibernate / No JPA
# ===============================
# JPA/Hibernate properties removed because this service uses JDBC only.
# spring.jpa.* use nahi karna hai

# ===============================
# JDBC Configuration
# ===============================
spring.jdbc.template.query-timeout=30

# ===============================
# JWT Configuration
# ===============================
# Same secret as auth-hospital
jwt.secret=PlasmitSaasJwtSecretKeyForAuthenticationServiceMinimumLength256Bits
jwt.access-token-expiration-ms=86400000
jwt.refresh-token-expiration-ms=604800000

# ===============================
# Logging Configuration
# ===============================
logging.level.root=INFO
logging.level.com.plasmit.prescription.hospital=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO

# SQL query console mein bahut zyada nahi chahiye toh INFO rakho
logging.level.org.springframework.jdbc.core=INFO

# Log file will be created here:
# C:\Users\ms\OneDrive\Desktop\prescription-hospital\logs\prescription-hospital.log
logging.file.name=logs/prescription-hospital.log

# Console log pattern with MDC fields
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} requestId=%X{requestId} tenantId=%X{tenantId} hospitalId=%X{hospitalId} branchId=%X{branchId} userId=%X{userId} - %msg%n

# File log pattern with MDC fields
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} requestId=%X{requestId} tenantId=%X{tenantId} hospitalId=%X{hospitalId} branchId=%X{branchId} userId=%X{userId} - %msg%n

# ===============================
# Error Response Configuration
# ===============================
server.error.include-message=always
server.error.include-binding-errors=always

# ===============================
# JSON / Timezone Configuration
# ===============================
spring.jackson.time-zone=Asia/Kolkata